name: Sync customer API docs

# When the API changes, regenerate the customer-facing OpenAPI spec and
# open a pull request in the documentation repository. The docs update is
# reviewed by the team before it goes live.
#
# Required secrets (Settings → Secrets and variables → Actions):
#   DOCS_REPO_TOKEN  – fine-grained PAT with read/write access to the docs repo
#                      (permissions: Contents read+write, Pull requests read+write)
#
# Required variables (Settings → Secrets and variables → Actions → Variables):
#   DOCS_REPO        – Sanskargupta0/Piosphere

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/export_openapi.py"
      - ".github/workflows/sync-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-docs
  cancel-in-progress: true

env:
  SPEC_PATH_IN_DOCS_REPO: docs/openapi.json

jobs:
  sync-docs:
    name: Filter customer APIs and open docs PR
    runs-on: ubuntu-latest

    steps:
      - name: Check out service repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "fastapi>=0.115" "pydantic[email]"

      - name: Generate customer-facing OpenAPI spec
        run: python scripts/export_openapi.py --output customer-openapi.json

      - name: Check out documentation repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.DOCS_REPO }}
          token: ${{ secrets.DOCS_REPO_TOKEN }}
          path: docs-repo
          ref: main

      - name: Check whether the spec actually changed
        id: diff
        run: |
          if cmp --silent customer-openapi.json "docs-repo/${{ env.SPEC_PATH_IN_DOCS_REPO }}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Customer OpenAPI spec unchanged — no PR needed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy the generated spec into the docs repository
        if: steps.diff.outputs.changed == 'true'
        run: cp customer-openapi.json "docs-repo/${{ env.SPEC_PATH_IN_DOCS_REPO }}"

      - name: Create pull request in documentation repository
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.DOCS_REPO_TOKEN }}
          path: docs-repo
          branch: sync/customer-openapi
          delete-branch: true
          title: "docs: update customer OpenAPI spec from api-service"
          commit-message: |
            docs: update customer OpenAPI spec from api-service

            Generated by the sync-docs workflow in api-service
            (commit ${{ github.sha }}).
          body: |
            This pull request updates the customer-facing OpenAPI specification.

            It was created automatically by the **sync-docs** workflow in the
            **api-service** repository after commit
            [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}).

            **What to review:** the diff below shows exactly what changes in the
            customer documentation at `/docs` once this is merged and deployed.

            | | |
            |---|---|
            | Source | `${{ github.repository }}@${{ github.sha }}` |
            | Workflow | [sync-docs run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
          labels: |
            documentation
            automated
